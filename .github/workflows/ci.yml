name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Keyed by the calling workflow too: when Deploy runs these tests, they must not cancel (or be cancelled by)
# the standalone CI run for the same push.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-java@v4  # the Firestore emulator runs on Java
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - name: Tests (including the Firestore emulator round trip)
        run: npx --yes firebase-tools@13 emulators:exec --config ../firebase.json --only firestore --project demo-throughline "python -m pytest -q"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production image builds
        run: docker build -t throughline:ci .
